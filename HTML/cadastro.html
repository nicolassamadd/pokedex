<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/cadastro.css">
    <title>Cadastro - Pokedex</title>
</head>

<body data-pagina="cadastro">
    <main class="screen">
        <a class="back-btn" href="/HTML/login.html" aria-label="Voltar para o login">&#8592;</a>

        <header class="logo-placeholder">
            <img src="/IMG/pokedex.png" alt="Pokédex" class="logo">
        </header>

        <h1 class="so-leitor">Criação de conta</h1>
        <button type="submit" form="form-cadastro" class="create-account-btn">
            <span class="icon" aria-hidden="true">&#128100;+</span>
            <span>Criação de conta</span>
        </button>

        <form id="form-cadastro">
            <div class="input-group">
                <label for="nome" class="so-leitor">Nome</label>
                <div class="input-box">
                    <span class="icon" aria-hidden="true">&#128100;</span>
                    <input type="text" id="nome" name="nome" required placeholder="Nome" autocomplete="name">
                </div>
            </div>

            <div class="input-group">
                <label for="email" class="so-leitor">E-mail</label>
                <div class="input-box">
                    <span class="icon" aria-hidden="true">&#9993;</span>
                    <input type="email" id="email" name="email" required placeholder="E-mail" autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label for="senha" class="so-leitor">Senha</label>
                <div class="input-box">
                    <span class="icon" aria-hidden="true">&#128274;</span>
                    <input type="password" id="senha" name="senha" required minlength="6" placeholder="Senha (mín. 6)" autocomplete="new-password">
                    <button type="button" class="eye-icon" data-olho="senha" aria-label="Mostrar senha">&#128065;</button>
                </div>
            </div>
        </form>

        <figure class="character-placeholder">
            <img src="/IMG/dragao.png" alt="Charizard" class="character">
        </figure>
    </main>

    <script src="script.js"></script>
</body>

</html>
