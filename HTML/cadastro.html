<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex - Login</title>
  <link rel="stylesheet" href="/pokedex/CSS/cadastro.css">
  <link rel="stylesheet" href="/CSS/extras.css">

</head>

<body>

  <div class="screen">

    <button class="back-btn">&#8592;</button>

    <div class="logo-placeholder">
      <img src="/pokedex/IMG/pokedex.png" alt="Pokédex" class="logo">
    </div>

    <button class="create-account-btn">
      <span class="icon">&#128100;+</span>
      <span>Criação de conta</span>
    </button>

    <div class="input-group">
      <div class="input-box">
        <span class="icon">&#9993;</span>
        <input type="email" placeholder="E-mail">
      </div>
    </div>

    <div class="input-group">
      <div class="input-box">
        <span class="icon">&#128274;</span>
        <input type="password" placeholder="Senha">
        <span class="eye-icon">&#128065;</span>
      </div>
    </div>

    <div class="character-placeholder">
      <img src="/pokedex/IMG/image 8 (1).png" alt="Charizard" class="character">
    </div>

  </div>

  <script src="/script.js"></script>

</body>

</html>
