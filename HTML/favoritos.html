<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/favoritos.css">
    <title>Favoritos - Pokedex</title>
</head>

<body data-pagina="favoritos">
    <a class="pular" href="#conteudo">Ir para o conteúdo</a>
    <header class="topo">
        <button type="button" class="menu-hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-lista"></button>
        <nav id="menu-lista" class="menu-lista" aria-label="Menu principal" hidden>
            <ul>
                <li><a href="/HTML/perfil.html"><span class="icone" aria-hidden="true">👤</span>Perfil</a></li>
                <li><a href="/HTML/favoritos.html"><span class="icone" aria-hidden="true">♥</span>Meus favoritos <span class="contador" hidden>0</span></a></li>
                <li><a href="/HTML/index.html"><span class="icone" aria-hidden="true">⚡</span>Mais Pokémons</a></li>
                <li><button type="button" class="sair" id="btn-sair"><span class="icone" aria-hidden="true">⎋</span>Sair / Deslogar</button></li>
            </ul>
        </nav>
        <a href="/HTML/index.html" class="logo"><img src="/IMG/dragao.png" alt="Pokédex - dragão soltando fogo." class="imagemHeader"></a>
        <a href="/HTML/perfil.html" class="btn-user" aria-label="Meu perfil"><img src="/IMG/user.png" alt="" class="imgUser"></a>
    </header>
    <main id="conteudo">
        <section aria-labelledby="titulo-lista">
            <h1 id="titulo-lista" class="titulo-pagina">Meus favoritos</h1>
            <form class="pesquisa" role="search">
                <label for="pesquisar" class="so-leitor">Pesquisar Pokémon</label>
                <input type="search" placeholder="Pesquisar Pokémon" id="pesquisar" autocomplete="off">
                <div class="filtros">
                    <hr>
                    <button type="button" class="btn-filtros" id="btn-filtros" aria-expanded="false" aria-controls="grupo-filtros">Filtros</button>
                    <div class="filtro" id="grupo-filtros" role="group" aria-label="Filtrar por tipo" hidden>
                        <button type="button" aria-pressed="true">Todos</button>
                        <button type="button" aria-pressed="false">Fogo</button>
                        <button type="button" aria-pressed="false">Água</button>
                        <button type="button" aria-pressed="false">Planta</button>
                        <button type="button" aria-pressed="false">Elétrico</button>
                        <button type="button" aria-pressed="false">Exóticos</button>
                        <button type="button" aria-pressed="false">Favoritos</button>
                    </div>
                </div>
            </form>
            <div id="cards" class="cards-pokemon" aria-live="polite"></div>
            <button type="button" class="ver-mais" id="ver-mais" hidden>Ver mais ⌄</button>
        </section>
    </main>
    <footer>
        <p>© 2026 Pokedex. Todos os direitos reservados.</p>
        <p>Desenvolvido por PIE UniAmérica.</p>
    </footer>

    <script src="../script.js"></script>
</body>

</html>
