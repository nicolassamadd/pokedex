<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/pokemon.css">
    <link rel="stylesheet" href="/CSS/extras.css">
    <title>Pokémon - Pokedex</title>
</head>

<body>
    <header>
        <!-- Menu Hamburger -->
        <div class="menu-hamburger">
            <div class="Perfil"></div>
            <div class="Meus favoritos"></div>
            <div class="Mais Pokémons"></div>
            <div class="Sair / Deslogar"></div>
        </div>

        <img src="/IMG/dragao.png" alt="Imagem de um dragão soltando fogo." class="imagemHeader">

        <a href="perfil.html"><img src="/IMG/user.png" alt="Icone de usuário." class="imgUser"></a>
    </header>
    <main>
        <div class="barra">
            <a href="index.html"><img src="/IMG/seta.png" alt="Voltar para a página inicial." class="setaVoltar"></a>

            <input type="text" placeholder="Pesquisar Pokémon" id="pesquisar">
            <label for="pesquisar"></label>
        </div>

        <!-- Tudo abaixo é preenchido pelo script.js com os dados da PokeAPI (pokemon.html?id=NÚMERO) -->
        <!-- A ficha (tipo, peso, altura e categoria) é criada pelo script.js antes desta imagem -->
        <img alt="Imagem do pokemon." class="pokemon">

        <div class="estatistica">
            <ul>
                <li style="--v:0">HP: -</li>
                <li style="--v:0">ATAQUE: -</li>
                <li style="--v:0">DEFESA: -</li>
                <li style="--v:0">SP. ATK: -</li>
                <li style="--v:0">SP. DEF: -</li>
                <li style="--v:0">VELOCIDADE: -</li>
            </ul>
            <div class="total"><span>TOTAL</span><b>-</b></div>
        </div>

        <div class="hr">
            <img src="/IMG/estrela.png" alt="">
            <p>FORMAS / VARIANTES</p>
            <hr>
        </div>

        <!-- Formas / variantes: criadas pelo script.js -->
        <article></article>

        <div class="hr">
            <img src="/IMG/pin.png" alt="">
            <p>ONDE ENCONTRAR?</p>
            <hr>
        </div>

        <!-- Locais: criados pelo script.js -->
        <aside></aside>
    </main>
    <footer>
        <div class="informacoesFooter">
            <p>© 2026 Pokedex. Todos os direitos reservados.</p>
            <p>Desenvolvido por PIE UniAmérica.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
