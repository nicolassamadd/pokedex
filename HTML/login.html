
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PokéDex</title>
<link rel="stylesheet" href="/pokedex/CSS/login.css">
</head>
<body>

  <main class="container">

    <section class="login-box" aria-label="Formulário de login">

      <div class="logo-topo">
        <img src="/pokedex/IMG/dragao.png" alt="">
        <img src="/pokedex/IMG/img-login.png" alt="">
      </div>

      <div class="divisor">
        <span class="linha"></span>
        <span class="linha"></span>
      </div>

      <form action="#" method="post" novalidate>

        <div class="campo">
          <input type="email" id="email" name="email" placeholder="E-MAIL" required autocomplete="email">
        </div>

        <div class="campo campo-espacamento">
          <input type="password" id="senha" name="senha" placeholder="SENHA" required autocomplete="current-password">
          <button type="button" class="btn-olho" id="toggleSenha">MOSTRAR</button>
        </div>

        <button type="submit" class="btn-entrar">
          ENTRAR
        </button>

        <p class="esqueceu">
          <a href="#">Esqueceu sua senha?</a>
        </p>

      </form>

      <button type="button" class="btn-criar-conta">
        CRIAR CONTA
      </button>

    </section>

    <section class="ilustracao" aria-hidden="true">

      <div class="img-placeholder img-placeholder--titulo">
        <img src="/pokedex/IMG/pokedex.png" alt="">
      </div>

      <div class="img-placeholder img-placeholder--mascote">
        <img src="/pokedex/IMG/pikachu.png" alt="">
      </div>

    </section>

  </main>
</body>
</html>
