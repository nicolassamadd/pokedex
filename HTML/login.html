<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/login.css">
    <link rel="stylesheet" href="/CSS/extras.css">

    <title>Login - Pokedex</title>
</head>

<body>
    <header>
        <img src="/IMG/dragao.png" alt="Imagem de um dragão soltando fogo." class="imagemHeader">
        <img src="/IMG/img-login.png"
            alt="Uma imagem com uma escrita Login e um desenho de uma pokebola logo abaixo da ecrita."
            class="imagemHeader">
    </header>
    <main>
        <div class="ladoesquerdo">
            <form action="">
                <input type="email" required placeholder="E-MAIL">
                <label id="email" for="email"></label>

                <input type="password" required placeholder="SENHA">
                <label id="senha" for="senha"></label>

                <button type="submit"> ENTRAR </button>
            </form>

            <a href="/HTML/rec.senha.html">Esqueceu sua senha?</a>

            <a href="/HTML/cadastro.html">CRIAR CONTA</a>
        </div>

        <div class="ladodireito">
            <img src="/IMG/pokedex.png" alt="Uma escrita Pokedex.">
            <img src="/IMG/pikachu.png" alt="Imagem do pokemón Pikachu.">
        </div>
    </main>

    <script src="/script.js"></script>
</body>

</html>
